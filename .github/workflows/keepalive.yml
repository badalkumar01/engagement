name: keep-warm

# Pings the backend every ~10 minutes so Render's free tier does not spin down.
# A spun-down server causes the "Gemini request timed out" cold-start delay.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 60 https://engagement-assistant-backend.onrender.com/api/health || true
